# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Secrets marked "sync: false" are asked for once when you create the service.
services:
  - type: web
    name: tollgate
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HUB_ADMIN_TOKEN
        generateValue: true
      - key: HUB_SIGNING_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: TOLLGATE_FEE_BPS
        value: "100"
